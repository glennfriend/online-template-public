<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Screen Flow Map</title>
<!-- 網頁字型: 離線時載入失敗, 會退回 --f-body / --f-mono 裡的系統字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- ===================== 結構區 (CSS) ===================== -->
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* Layout: 每個故事 = 一排畫面框 (看得到什麼 / 可以做什麼), 箭頭寫按了什麼; 故事的條件與結果統一放在下方 */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --ink: #16211e;
  --muted: #5d6c67;
  --line: #d2dad7;
  --accent: #1d5fbf;
  --accent-soft: #e6eefb;
  --ours: #0f766e;
  --ours-soft: #e2f3f0;
  --ext: #7a6f63;
  --ext-soft: #efebe6;
  --sys: #6b4fa0;
  --sys-soft: #f0ebf8;
  --gate: #a35a00;
  --gate-soft: #fdf1df;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101614; --surface: #19211f; --ink: #e3ebe8; --muted: #9aaaa5; --line: #2d3a36;
  --accent: #8ab4ff; --accent-soft: #1a2c4a; --ours: #4fd1c0; --ours-soft: #11302b;
  --ext: #c9b9a6; --ext-soft: #2b2723; --sys: #c3a8f0; --sys-soft: #2a2238;
  --gate: #f2b057; --gate-soft: #3a2a12; --bad: #ff8a80; --bad-soft: #3b1c1a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101614; --surface: #19211f; --ink: #e3ebe8; --muted: #9aaaa5; --line: #2d3a36;
  --accent: #8ab4ff; --accent-soft: #1a2c4a; --ours: #4fd1c0; --ours-soft: #11302b;
  --ext: #c9b9a6; --ext-soft: #2b2723; --sys: #c3a8f0; --sys-soft: #2a2238;
  --gate: #f2b057; --gate-soft: #3a2a12; --bad: #ff8a80; --bad-soft: #3b1c1a;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0 }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 72px; overflow-x: clip;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 900; margin: 0 0 6px; text-wrap: balance }
h2 { font-size: 22px; font-weight: 900; margin: 0 0 4px; text-wrap: balance }
h3 { font-size: 17px; font-weight: 700; margin: 0; text-wrap: balance }
p { margin: 0 }
a { color: var(--accent) }
code { font-family: var(--f-mono); font-size: .86em }
.meta { color: var(--muted); font-size: 13px }
.lead { max-width: 72ch; color: var(--muted) }
section { margin-top: 40px }
.sec-intro { color: var(--muted); max-width: 72ch; margin-bottom: 14px }
.err { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; white-space: pre-wrap; font-family: var(--f-mono); font-size: 13px }

/* 圖例: 5 種, 圖示樣式對應 legend[].kind */
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 18px }
.howto div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start }
.howto .ico { flex: none; width: 44px; height: 30px; border-radius: 5px; border: 1.5px solid }
.howto .ico.k-ext { border-color: var(--ext); border-style: dashed; background: var(--ext-soft) }
.howto .ico.k-ours { border-color: var(--ours); background: var(--ours-soft) }
.howto .ico.k-modal { border-color: var(--ours); border-style: double; border-width: 4px }
.howto .ico.k-sys { border: 0; background: var(--sys-soft) }
.howto .ico.k-gate { border: 0; border-left: 3px solid var(--gate); background: var(--gate-soft) }
.howto b { display: block; font-size: 14px }

/* 流程索引 */
.idx { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px }
.idx-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.idx-box h3 { margin-bottom: 8px }
.idx-row { display: grid; grid-template-columns: 9.5em 1fr; gap: 4px 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px }
.idx-row:first-of-type { border-top: 0 }
.idx-row .k { font-weight: 700 }
.links { display: flex; flex-wrap: wrap; gap: 4px 6px }
.sl { font-size: 13px; text-decoration: none; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); white-space: nowrap }
.sl:hover { border-color: var(--accent); color: var(--accent) }
.sl b { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-right: 4px; font-weight: 500 }

/* 故事 */
.group { margin-top: 36px }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; min-width: 0; scroll-margin-top: 16px }
.st-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.st-id { font-family: var(--f-mono); font-size: 12px; color: var(--surface); background: var(--ink); border-radius: 4px; padding: 0 6px }
.lane { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 0; margin-top: 14px }

/* 故事說明: 統一放下方, 同一種格式 */
.facts { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px }
.fact { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; font-size: 14px; max-width: 110ch }
.fact .lb { font-weight: 700; color: var(--muted) }
.fact .tx b { font-weight: 700 }
.l { display: block }
.issues li .l, .plain div .l { margin-top: 2px }

/* 畫面框 */
.scr { width: 232px; flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start }
.win, .bar { min-width: 0 }
.cap { font-size: 14px; font-weight: 700; line-height: 1.35 }
.cap small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }
.win { border: 1.5px solid var(--ours); border-radius: 8px; background: var(--surface); font-size: 13px; line-height: 1.5 }
.bar { display: flex; align-items: center; gap: 5px; padding: 4px 6px; background: var(--ours-soft); border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; position: relative }
.dots { display: flex; gap: 3px } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line) }
.uw { flex: 1; min-width: 0; position: relative; display: flex }
.url { flex: 1; min-width: 0; font: inherit; font-family: var(--f-mono); font-size: 10px; text-align: left; background: var(--surface); border: 1px solid transparent; border-radius: 4px; padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); cursor: pointer }
.url:focus-visible { outline: 2px solid var(--accent) }
.full { display: none; position: absolute; left: 0; top: -1px; z-index: 20; width: max-content; min-width: 100%; max-width: min(460px, 86vw);
  font-family: var(--f-mono); font-size: 11.5px; line-height: 1.45; word-break: break-all; text-align: left;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--accent); border-radius: 4px; padding: 1px 6px; box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer }
.uw:hover .full, .url:focus-visible + .full { display: block }
.back { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
  font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 99px; border: 0; background: var(--accent); color: var(--surface); box-shadow: 0 6px 18px rgba(0,0,0,.22); cursor: pointer }
.back:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.win.flash { outline: 3px solid var(--accent); outline-offset: 2px }
.who { font-size: 10px; font-weight: 700; color: var(--ours); white-space: nowrap }
.win.ext { border-color: var(--ext); border-style: dashed }
.win.ext .bar { background: var(--ext-soft) }
.win.ext .who { color: var(--ext) }
.win.modal { border-style: double; border-width: 4px }
.body { padding: 8px 10px 10px; display: grid; gap: 6px }
.blk .h { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .04em }
.blk ul { margin: 0; padding-left: 16px }
.blk li { margin: 1px 0 }
.blk li.pick { font-weight: 700; color: var(--accent); list-style: none; margin-left: -16px; padding-left: 16px; position: relative }
.blk li.pick::before { content: "▶"; position: absolute; left: 1px; font-size: 10px; top: 3px }
.side { display: grid; gap: 4px }
.side div { font-size: 12.5px; line-height: 1.45; border-left: 3px solid var(--gate); background: var(--gate-soft); padding: 3px 7px; border-radius: 0 5px 5px 0 }
.side b { color: var(--gate) }

/* 箭頭 */
.go { width: 104px; flex: none; display: grid; justify-items: center; align-content: start; gap: 3px; padding: 46px 6px 0; text-align: center; font-size: 12.5px; line-height: 1.35 }
.go .ln { width: 100%; height: 2px; background: var(--ink); position: relative; margin: 4px 0 }
.go .ln::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--ink); border-right: 0 }
.go .by { font-weight: 700; color: var(--accent) }
.go .sys { color: var(--sys); background: var(--sys-soft); border-radius: 5px; padding: 2px 5px; font-size: 12px }
.go .sys b { font-weight: 700 }

/* 分岔 */
.fork { width: 300px; max-width: 100%; flex: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start }
.fk { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px; background: var(--surface) }
.fk .if { color: var(--muted) }
.fk .then { font-weight: 700 }
.fk.badk { border-color: var(--bad); background: var(--bad-soft) }

/* 參考資料 */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px }
summary { cursor: pointer; padding: 12px 16px; font-weight: 700; font-size: 16px }
summary:focus-visible, .sl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
details > .in { padding: 0 16px 16px }
.tbl { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 720px }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line) }
th { font-size: 12.5px; color: var(--muted); font-weight: 500; background: var(--bg) }
td:first-child { font-weight: 700; white-space: nowrap }
.plain { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px }
.plain div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px }
.plain b { display: block; font-size: 15.5px }
.issues { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none }
.issues li { border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 6px; padding: 9px 13px; font-size: 14px }
.issues li.q { border-left-color: var(--gate) }
.issues b { display: block }

/* 網址索引 */
.uidx { display: grid; gap: 18px }
.ug h3 { margin-bottom: 6px }
.ur { display: grid; grid-template-columns: minmax(0, 20em) minmax(0, 1fr); gap: 4px 16px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 14px; border-radius: 6px; scroll-margin-top: 30vh }
.ur:first-of-type { border-top: 0 }
.ur .p { font-family: var(--f-mono); font-size: 12.5px; word-break: break-all; font-weight: 500 }
.ur .tag { display: inline-block; margin-left: 6px; font-family: var(--f-body); font-size: 11px; font-weight: 700; color: var(--gate); background: var(--gate-soft); border-radius: 4px; padding: 0 5px; vertical-align: 1px }
.ur .q { font-size: 13px; color: var(--muted); margin-top: 6px }
.ur .qh { font-size: 11.5px; font-weight: 700; letter-spacing: .04em }
.ur .q ul { margin: 2px 0 0; padding-left: 18px }
.ur .q li { margin: 1px 0 }
.ur .q code { color: var(--ink) }
.ur .st { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px }
.ur.flash { background: var(--accent-soft); outline: 2px solid var(--accent) }
@media (max-width: 640px) { .ur { grid-template-columns: minmax(0, 1fr) } }
@media (prefers-reduced-motion: no-preference) { .ur { transition: background .4s } }
</style>
</head>

<!-- ===================== 結構區 (HTML) =====================
     只有空的容器, 文字全部由資料區填入. -->
<div class="wrap">
  <header>
    <h1 id="page-h1"></h1>
    <p class="lead" id="page-sub" hidden></p>
    <div class="howto" id="legend"></div>
  </header>

  <section id="flow-index">
    <h2 style="margin-bottom:14px" id="idx-title"></h2>
    <div class="idx">
      <div class="idx-box"><h3 id="idx-entry-title"></h3><div id="idx-entry"></div></div>
      <div class="idx-box"><h3 id="idx-goal-title"></h3><div id="idx-goal"></div></div>
    </div>
  </section>

  <div id="stories"></div>

  <section id="reference">
    <h2 id="ref-title"></h2>
    <p class="sec-intro" id="ref-intro" hidden></p>
    <div id="ref-body"></div>
  </section>

  <section id="url-index">
    <h2 id="uidx-title"></h2>
    <div class="uidx" id="uidx"></div>
  </section>
</div>

      "rows": [
        ["一般商店", "www.cozymart.example", "任何人, 結帳要登入", "信用卡, 貨到付款", "有 Plus 會員, 優惠碼, 廣告活動頁"],
        ["企業採購站", "business.cozymart.example", "公司帳號底下的員工", "月結發票", "沒有優惠碼; 訂單要主管核准才出貨"],
        ["員工福利站", "perks.cozymart.example", "合作公司的員工, 用公司 Email 註冊", "福利點數, 不足再刷卡", "只賣挑選過的商品, 沒有 Plus 會員"]
      ]
    }
  ]
}
</script>
<!-- ===================== 資料區 (結束) ===================== -->

<!-- ===================== 結構區 (render script) =====================
     通用引擎, 不含任何主題內容. 文字一律來自資料區, 或下面的 UI 字串物件. -->
<script>
/* 通用 UI 文字. 資料區可用 "ui": { ... } 覆寫任一項. */
const UI_DEFAULT = {
  whoPage: '我們的網站', whoModal: '彈出視窗', whoExt: '外部網站',
  see: '看得到', can: '可以做', sideIf: '如果', forkIf: '如果', forkThen: '→',
  sys: '系統: ', params: '參數', admin: 'admin', openIssue: '沒確認: ',
  factCond: '出現條件', factDone: '完成', factNext: '接著', factNote: '補充',
  urlAria: '完整網址 {url}, 點一下看網址索引', back: '↩ 回到故事 {id}',
  missingRoute: '網址索引缺少:', missingStory: '流程索引指到不存在的故事:',
  loadError: '資料區讀取或畫圖失敗'
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fill = (tpl, o) => tpl.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

/* 一行一個訊息: 依句號或分號斷行, 並拿掉行尾的句號. 開頭的 <b>標題</b> 保留在最前面 */
function splitLines(h) {
  const m = h.match(/^(\s*<b>[\s\S]*?<\/b>)([\s\S]*)$/);
  const head = m ? m[1] : '', body = m ? m[2] : h;
  // HTML 實體 (&quot; &amp;) 結尾的分號不算斷句; 斷行後行首殘留的 , ; 拿掉
  const parts = body.split(/(?<=\.)\s+|(?<!&[a-z#0-9]+);\s+/).map(t => t.trim().replace(/^[,;]\s*/, '').replace(/\.$/, '').replace(/(?<!&[a-z#0-9]+);$/, '')).filter(Boolean);
  return head + parts.map(t => `<span class="l">${t}</span>`).join('');
}

function render(D, UI) {
  const BASE = String(D.baseUrl || '').replace(/\/+$/, '');
  const S = D.sections || {};
  const setText = (id, t) => { const el = document.getElementById(id); el.textContent = t ?? ''; if (t) el.hidden = false; };

  /* ---------- 頁首: title, h1, 副標, 圖例 ---------- */
  document.title = D.page.title;
  setText('page-h1', D.page.h1);
  setText('page-sub', D.page.subtitle);
  document.getElementById('legend').innerHTML = (D.legend || []).map(x =>
    `<div><span class="ico k-${esc(x.kind)}"></span><span><b>${esc(x.title)}</b>${esc(x.text)}</span></div>`).join('');
  setText('idx-title', S.index); setText('idx-entry-title', S.indexByEntry); setText('idx-goal-title', S.indexByGoal);
  setText('ref-title', S.reference); setText('ref-intro', S.referenceIntro); setText('uidx-title', S.urlIndex);

  /* ---------- 網址 -> 網址索引列 ---------- */
  const isInternal = url => BASE && (url === BASE || url.startsWith(BASE + '/') || url.startsWith(BASE + '?'));
  const ROUTE_LIST = [];
  D.routes.forEach((g, gi) => g.items.forEach((it, ii) => {
    const id = `u-${gi}-${ii}`;
    if (it.match) ROUTE_LIST.push({ id, match: it.match });
    else ROUTE_LIST.push({ id, path: it.path, re: new RegExp('^' + it.path.split(/\{[^}]*\}/).map(reEsc).join('[^/]+') + '$') });
  }));
  function routeOf(url) {
    if (isInternal(url)) {
      const p = url.slice(BASE.length).split(/[?#]/)[0] || '/';
      const r = ROUTE_LIST.find(r => r.path === p) || ROUTE_LIST.find(r => r.re && r.re.test(p));
      return r ? r.id : '';
    }
    const r = ROUTE_LIST.find(r => r.match && url.includes(r.match));
    return r ? r.id : '';
  }
  const shownUrl = url => isInternal(url) ? (url.slice(BASE.length) || '/') : url;
  const USED = {};

  /* ---------- 故事 ---------- */
  const list = (h, arr, pick) => arr && arr.length ? `<div class="blk"><div class="h">${esc(h)}</div><ul>${arr.map(t => `<li${t === pick ? ' class="pick"' : ''}>${esc(t)}</li>`).join('')}</ul></div>` : '';
  function screen(x) {
    const cls = x.s === 'ext' ? ' ext' : x.s === 'modal' ? ' modal' : '';
    const who = x.who || (x.s === 'modal' ? UI.whoModal : x.s === 'ext' ? UI.whoExt : UI.whoPage);
    const side = (x.side || []).map(([i, t]) => `<div><b>${esc(UI.sideIf)}</b> ${esc(i)}: ${esc(t)}</div>`).join('');
    return `<div class="scr"><div class="cap">${esc(x.cap)}${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div>
    <div class="win${cls}"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="uw" data-key="${esc(routeOf(x.url))}" data-url="${esc(x.url)}"><button type="button" class="url" aria-label="${esc(fill(UI.urlAria, { url: x.url }))}">${esc(shownUrl(x.url))}</button><span class="full" aria-hidden="true">${esc(x.url)}</span></span><span class="who">${esc(who)}</span></div>
    <div class="body">${list(UI.see, x.see)}${list(UI.can, x.can, x.pick)}</div></div>${side ? `<div class="side">${side}</div>` : ''}</div>`;
  }
  const arrow = x => `<div class="go"><span class="by">${esc(x.by)}</span><span class="ln"></span>${x.sys ? `<span class="sys"><b>${esc(UI.sys)}</b>${esc(x.sys)}</span>` : ''}</div>`;
  const fork = x => `<div class="fork"><div class="cap">${esc(x.fork)}</div>${x.items.map(([i, t, c]) => `<div class="fk${c === 'bad' ? ' badk' : ''}"><div class="if">${esc(UI.forkIf)} ${esc(i)}</div><div class="then">${esc(UI.forkThen)} ${esc(t)}</div></div>`).join('')}</div>`;
  const fact = (lb, tx) => tx ? `<div class="fact"><span class="lb">${esc(lb)}</span><span class="tx">${splitLines(tx)}</span></div>` : '';

  const root = document.getElementById('stories');
  const byId = {};
  D.groups.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'group';
    sec.innerHTML = `<h2>${esc(g.title)}</h2>${g.intro ? `<p class="sec-intro">${esc(g.intro)}</p>` : ''}`;
    g.stories.forEach(st => {
      byId[st.id] = st;
      const lane = st.lane.map(x => x.by !== undefined ? arrow(x) : x.fork ? fork(x) : screen(x)).join('');
      st.lane.forEach(x => { if (x.url) { const k = routeOf(x.url); if (k) (USED[k] ||= new Set()).add(st.id); } });
      const el = document.createElement('article'); el.className = 'story'; el.id = 's-' + st.id;
      // cond / note 可含 HTML (<b> <code>); done / next 是純文字
      el.innerHTML = `<div class="st-head"><span class="st-id">${esc(st.id)}</span><h3>${esc(st.title)}</h3></div>
      <div class="lane">${lane}</div>
      <div class="facts">${fact(UI.factCond, st.cond)}${fact(UI.factDone, esc(st.done))}${fact(UI.factNext, st.next ? esc(st.next) : '')}${fact(UI.factNote, st.note)}</div>`;
      sec.appendChild(el);
    });
    root.appendChild(sec);
  });

  /* ---------- 流程索引 ---------- */
  const badIds = new Set();
  const link = id => {
    if (!byId[id]) { badIds.add(id); return ''; }
    const label = byId[id].short || byId[id].title.split(/[:,]/)[0];
    return `<a class="sl" href="#s-${esc(id)}"><b>${esc(id)}</b>${esc(label)}</a>`;
  };
  const idx = (el, rows) => document.getElementById(el).innerHTML = (rows || []).map(([k, ids]) =>
    `<div class="idx-row"><span class="k">${esc(k)}</span><span class="links">${ids.map(link).join('')}</span></div>`).join('');
  idx('idx-entry', D.index.byEntry); idx('idx-goal', D.index.byGoal);

  /* ---------- 參考資料: issues / cards / table ---------- */
  const REF = {
    issues: r => `<ul class="issues">${r.items.map(i => `<li${i.status === 'open' ? ' class="q"' : ''}><b>${i.status === 'open' ? esc(UI.openIssue) : ''}${esc(i.title)}</b>${i.text}</li>`).join('')}</ul>`,
    cards: r => `<div class="plain">${r.cards.map(c => `<div><b>${esc(c.title)}</b>${c.text}</div>`).join('')}</div>${r.note ? `<p class="meta" style="margin-top:10px">${r.note}</p>` : ''}`,
    table: r => {
      r.rows.forEach((row, i) => { if (row.length !== r.columns.length) console.warn(`參考資料表格 "${r.summary}" 第 ${i + 1} 列有 ${row.length} 格, 欄位有 ${r.columns.length} 個`); });
      return `<div class="tbl"><table><thead><tr>${r.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
  };
  document.getElementById('ref-body').innerHTML = (D.reference || []).map(r => {
    if (!REF[r.type]) throw new Error(`reference[].type 不認得: ${r.type} (只支援 issues, cards, table)`);
    return `<details${r.open ? ' open' : ''}><summary>${esc(r.summary)}</summary><div class="in">${REF[r.type](r)}</div></details>`;
  }).join('');
  if (!(D.reference || []).length) document.getElementById('reference').hidden = true;

  /* ---------- 網址索引 ---------- */
  document.getElementById('uidx').innerHTML = D.routes.map((g, gi) => `<div class="ug"><h3>${esc(g.title)}</h3>${g.items.map((it, ii) => {
    const id = `u-${gi}-${ii}`;
    const ids = [...(USED[id] || [])];
    return `<div class="ur" id="${id}"><div><div class="p">${esc(it.path)}${it.admin ? `<span class="tag">${esc(UI.admin)}</span>` : ''}</div>${ids.length ? `<div class="st">${ids.map(link).join('')}</div>` : ''}</div>
    <div><div class="desc">${splitLines(esc(it.desc))}</div>${it.params ? `<div class="q"><div class="qh">${esc(UI.params)}</div><ul>${it.params.map(([k, v]) => `<li><code>${esc(k)}</code> ${esc(v)}</li>`).join('')}</ul></div>` : ''}</div></div>`;
  }).join('')}</div>`).join('');

  /* ---------- 互動: 點網址跳索引 + flash, 浮動返回按鈕 ---------- */
  function flash(el) {
    el.scrollIntoView({ behavior: smooth(), block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 2400);
  }
  const back = document.createElement('button');
  back.type = 'button'; back.className = 'back'; back.hidden = true;
  document.body.appendChild(back);
  let origin = null;
  back.addEventListener('click', () => {
    if (!origin) return;
    flash(origin.closest('.win'));
    back.hidden = true; origin = null;
  });
  document.addEventListener('click', e => {
    const w = e.target.closest('.uw');
    if (!w) return;
    const row = w.dataset.key && document.getElementById(w.dataset.key);
    if (!row) return;
    origin = w;
    back.textContent = fill(UI.back, { id: w.closest('.story').id.replace('s-', '') });
    back.hidden = false;
    flash(row);
  });

  /* ---------- 開發自檢 ---------- */
  const missing = [...document.querySelectorAll('.uw')].filter(w => !w.dataset.key).map(w => w.dataset.url);
  if (missing.length) console.warn(UI.missingRoute, [...new Set(missing)]);
  if (badIds.size) console.warn(UI.missingStory, [...badIds]);

  /* 說明文字一行一個訊息 */
  document.querySelectorAll('.sec-intro, .plain div, .plain + .meta, .issues li').forEach(el => { el.innerHTML = splitLines(el.innerHTML); });
}

(() => {
  let UI = UI_DEFAULT;
  try {
    const D = JSON.parse(document.getElementById('screen-flow-data').textContent);
    UI = { ...UI_DEFAULT, ...(D.ui || {}) };
    render(D, UI);
  } catch (e) {
    // 誠實顯示錯誤: 放在頁面最上方, 不留半張圖
    console.error(e);
    const box = document.createElement('div'); box.className = 'err'; box.setAttribute('role', 'alert');
    box.textContent = `${UI.loadError}: ${e && e.message || e}`;
    document.querySelector('.wrap').prepend(box);
  }
})();
</script>
</body>
