<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>功能地圖</title>
<style>
:root { color-scheme:light dark; --bg:#f4f6f9; --card:#fff; --ink:#18283d; --muted:#5b6c80; --line:#dce3ed; --accent:#2459ad; --soft:#eaf1ff; --green:#176b47; --red:#af3041; --wire:#5983c2 }
@media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --bg:#121923; --card:#1b2635; --ink:#e5edf8; --muted:#a8b8cd; --line:#3a4a60; --accent:#a5c5ff; --soft:#263f64; --green:#83d7aa; --red:#ff9dab; --wire:#88ace5 } }
* {box-sizing:border-box}
body {margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,sans-serif}
main {margin:auto;max-width:none;padding:0}
h2 {font-size:15px;margin:0} p {margin:4px 0}
button {font:inherit;color:inherit;cursor:pointer}
button:focus-visible {outline:3px solid var(--accent);outline-offset:2px}
.muted {color:var(--muted)}
.mono {font-family:ui-monospace,monospace;font-size:13px}
#banner {margin:16px;padding:12px 16px;border:1px solid var(--red);border-radius:8px;color:var(--red);background:var(--card)}
#banner ul {margin:6px 0 0;padding-left:20px;font-size:13px;overflow-wrap:anywhere}
[hidden] {display:none!important}
/* Viewport layout: directory, callout and feature columns scroll independently. */
#interaction {height:100vh;height:100dvh;display:flex;flex-direction:column}
.toolbar {display:flex;align-items:center;padding:7px 10px;height:48px;min-height:48px;flex-shrink:0;border-bottom:1px solid var(--line)}
h1 {font-size:17px;margin:0;white-space:nowrap}
/* 工具列右邊: 左欄目錄 部分 / 全部 切換 (兩顆按鈕, aria-pressed 標出目前的模式) */
.tree-head {display:flex;align-items:center;padding-right:10px}
.tree-mode {margin-left:auto;display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tree-mode button {border:0;background:var(--card);padding:3px 12px;font-size:13px}
.tree-mode button+button {border-left:1px solid var(--line)}
.tree-mode button[aria-pressed=true] {background:var(--soft);color:var(--accent);font-weight:650}
.workspace {display:grid;flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 292px;align-items:stretch}
.map-shell,.feature-shell {background:var(--card);border:solid var(--line);border-width:0 1px 0 0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.map-head {display:grid;grid-template-columns:34% 66%;flex-shrink:0;border-bottom:1px solid var(--line);background:var(--card)}
.map-head h2:last-child {border-left:1px solid var(--line)}
.map-head h2,.feature-shell>h2 {padding:7px 10px}
#map-body {display:grid;position:relative;isolation:isolate;flex:1;min-height:0;grid-template-columns:34% 66%;align-items:stretch;overflow:hidden}
#tree-scroll,#callout-scroll {overflow:auto;min-height:0;min-width:0;overscroll-behavior:contain;scrollbar-gutter:stable}
#callout-scroll {border-left:1px solid var(--line)}
#tree {position:relative;z-index:2;min-width:0;padding:8px 7px}
#callouts {min-width:0;z-index:2;pointer-events:none;min-height:100%;position:relative}
#empty-callout {padding:20px;color:var(--muted)}
#wires {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:hidden}
#wires path {fill:none;stroke:var(--wire);stroke-width:1.6}
#wires circle {fill:var(--wire)}
.tree {list-style:none;margin:0;padding-left:14px;border-left:1px solid var(--line)}
.tree li {margin:1px 0}
.node {min-height:29px;display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:4px;border:1px solid transparent;overflow-wrap:anywhere}
.name {font:650 12px/1.5 ui-monospace,monospace;min-width:0}
/* 有 changes 時: 目錄右邊的統計. 欄寬 = 該欄最多位數 + 1ch (符號), 各列同一欄靠右對齊 */
.added {color:var(--green)} .deleted {color:var(--red)} .modified {color:var(--accent)} .unchanged {color:var(--muted)}
.node-meta {margin-left:auto;display:grid;grid-template-columns:var(--stat-columns);align-items:center;column-gap:4px;flex-shrink:0;font:10px ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right}
.node-meta .badge {font-weight:600;white-space:pre}
.stat-divider,.delta {color:var(--muted);white-space:nowrap}
.node-meta .binary-note {grid-column:1/-1}
.highlight {border-color:var(--accent)}
.callout {position:absolute;left:22px;right:8px;padding:9px 11px;border:1px solid var(--wire);border-radius:7px;background:var(--card);pointer-events:auto;overflow-wrap:anywhere}
.callout-path {font:650 13px ui-monospace,monospace;color:var(--accent);margin:0 0 6px}
.callout p {font-size:13px;margin:0}
.directory-note {padding-bottom:7px;color:var(--muted)}
/* Two columns, shared by every row in a callout: file name, then its note. */
.file-list {display:grid;grid-template-columns:fit-content(34%) minmax(0,1fr);column-gap:12px}
.file-row {display:grid;grid-template-columns:subgrid;grid-column:1/-1;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.filename {font-family:ui-monospace,monospace;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.file-note {min-width:0;overflow-wrap:anywhere}
/* 有 changes 時多三欄: 狀態符號、+行數、−行數. 行數分兩欄各自靠右, 同一框內位數對齊; binary 與沒有變動跨兩欄靠左 */
.file-list.changes {grid-template-columns:12px fit-content(34%) auto auto minmax(0,1fr);column-gap:8px}
.file-row .status {font-family:ui-monospace,monospace;font-weight:650}
.file-row .delta {display:grid;grid-template-columns:subgrid;grid-column:span 2;column-gap:6px;text-align:right;font:11px ui-monospace,monospace;font-variant-numeric:tabular-nums}
.file-row .delta.single {display:block;text-align:left;font-family:inherit}
.feature-shell>h2 {border-bottom:1px solid var(--line)}
#features {flex:1;min-height:0;overflow:auto;padding:6px;overscroll-behavior:contain}
.feature {margin-bottom:6px}
.feature {display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px}
.feature:focus:not(:focus-visible) {outline:none}
.feature[aria-pressed=true] {background:var(--soft);border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.feature-title {font-weight:650;margin-bottom:4px;font-size:13px}
.feature-why {font-size:12px;color:var(--muted)}
#footer {padding:24px;border-top:1px solid var(--line)}
.report-info {display:grid;grid-template-columns:minmax(0,1fr) minmax(400px,1fr);gap:32px;align-items:start;margin-top:16px}
.report-info:not(:has(.stats)) {grid-template-columns:minmax(0,1fr)}
.metadata {display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px 16px;margin:0}
.metadata dt {color:var(--muted)}.metadata dd {margin:0;overflow-wrap:anywhere}
/* 頁底統計卡: 和左欄同一套符號, 兩張等寬 */
.stats {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat {display:flex;flex-direction:column;padding:20px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.stat strong {display:flex;flex-wrap:wrap;column-gap:.5em;font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}
.stat strong .delta {color:var(--muted)}
.stat > span {font-size:12px;color:var(--muted)}
.hints {margin-top:20px;color:var(--muted);font-size:12px}
.footer-heading {margin-top:24px}
/* 功能與 commit: 一個功能一行, commit 有 PR 時連到 PR, 沒有就連到 commit 頁 */
.feature-commits {border-collapse:collapse;margin:12px 0 0}
.feature-commits td {padding:3px 24px 3px 0;vertical-align:top}
.feature-commits .commit-list {display:flex;flex-wrap:wrap;gap:4px 12px}
#footer a {color:var(--accent)}
/* 說明框裡的檔名與目錄名是連結 */
.callout a {color:var(--accent)}
.callout-path a,.filename {text-decoration:none}
.callout-path a:hover,a.filename:hover {text-decoration:underline}
@media(max-width:1000px) {
  #interaction {height:auto;min-height:100dvh}
  .toolbar {flex-wrap:wrap;height:auto}.toolbar h1 {font-size:16px;white-space:normal}
  .workspace {display:flex;flex-direction:column;flex:initial}.map-shell,.feature-shell {width:100%}
  .feature-shell {order:-1}
  #features {flex:auto;max-height:260px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
  .feature {margin:0}
  .map-head {display:block}.map-head h2:last-child {display:none}
  #map-body {display:flex;flex-direction:column;overflow:visible}
  #tree-scroll {max-height:45vh}#callout-scroll {overflow:visible;border:0}
  #callouts {padding:8px;min-height:0!important}
  .callout {position:static;margin-bottom:8px}
  #wires {display:none}
  .report-info {grid-template-columns:minmax(0,1fr);gap:20px}
}
</style>
</head>
<body>
<main>
<div id="banner" role="alert" hidden></div>
<div id="content" hidden>
<div id="interaction">
<header class="toolbar"><h1 id="title"></h1></header>
<div class="workspace">
<section class="map-shell" aria-label="專案目錄與說明">
<div class="map-head"><div class="tree-head"><h2 id="tree-heading">目錄</h2><div class="tree-mode" role="group" aria-label="左欄目錄"><button type="button" data-mode="partial" aria-pressed="true" title="左欄只列根目錄、目錄 target 與 target 的上層目錄">部分</button><button type="button" data-mode="all" aria-pressed="false" title="左欄列出 path 底下每個目錄, 全部展開">全部</button></div></div><h2 id="callout-heading">相關目錄與檔案</h2></div>
<div id="map-body"><div id="tree-scroll"><div id="tree"></div></div><div id="callout-scroll"><div id="callouts" aria-labelledby="callout-heading"></div></div><svg id="wires" aria-hidden="true"></svg></div>
</section>
<aside class="feature-shell" aria-label="功能清單"><h2 id="feature-heading">功能</h2><div id="features"></div></aside>
</div>
</div>
<footer id="footer"></footer>
</div>
</main>
<!-- 引擎: 讀下面的資料區塊 (id="feature-map-data") 畫圖, 不含任何專案內容 -->
<script>
document.addEventListener('DOMContentLoaded',()=>{
'use strict';
// ============ 1. 共用小工具 ============
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const n=document.createElement(tag); if(text!==undefined)n.textContent=text; if(cls)n.className=cls; return n;};
const link=(href,text,cls)=>{const a=el('a',text,cls); a.href=href; a.target='_blank'; a.rel='noopener'; return a;};
const shortSha=sha=>sha.slice(0,7);
function showBanner(title,lines){
  const box=$('banner');
  const h=el('strong',title), ul=el('ul');
  lines.forEach(t=>ul.appendChild(el('li',t)));
  box.append(h,ul); box.hidden=false;
  console.error(title,lines);
}

// ============ 2. 讀資料區塊 ============
// 資料是 JSON, 放在 type="application/json" 的 script 區塊. 字串裡出現 "\x3c/script" 會讓瀏覽器提早結束區塊,
// 所以資料裡的 < 一律寫成 \u003c (JSON 標準的跳脫寫法); 含 "\x3c!--" 或 "\x3cscript" 的原始文字也當成錯誤.
// 注意: 這段引擎自己也不能直接寫出這些字樣, 否則會提早結束引擎的 script, 所以字串裡一律用 \x3c 代替 <
const node=$('feature-map-data');
const TAG_HINT='資料裡的 < 要寫成 \\u003c; 字串含 \x3c/script 時瀏覽器會在那裡提早結束資料區塊, 後半段會變成頁面文字';
if(!node){showBanner('找不到資料區塊, 頁面無法運作:',['需要 \x3cscript type="application/json" id="feature-map-data">']);return;}
const raw=node.textContent;
if(/\x3c!--|\x3c\/?script/i.test(raw)){showBanner('資料區塊有錯, 地圖無法畫出來:',['資料區塊含有 \x3c!-- 或 \x3cscript 字樣. '+TAG_HINT]);return;}
let D;
try{D=JSON.parse(raw);}catch(err){showBanner('資料區塊不是合法的 JSON, 地圖無法畫出來:',[err.message,TAG_HINT]);return;}

// ============ 3. 資料檢查 ============
// 規則對應 TECHNICAL.md 的 "資料欄位". 有錯就整張圖不畫, 一次列出全部錯誤.
// 為什麼不略過有錯的項目: target 指到不存在的目錄時, 畫出來的線和框會指錯地方, 反而誤導.
const SCHEMA=5;
const SHA=/^[0-9a-f]{40}$/, GITHUB=/^https:\/\/github\.com\/[A-Za-z0-9-]+\/[A-Za-z0-9._-]+$/;
const str=v=>typeof v==='string'&&v.trim()!=='';
const obj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
// 相對路徑, 不含 . 與 .. 片段, 不含空片段; 目錄只能有一個結尾 /. path 欄位本身可以是 "."
function validPath(v){
  if(!str(v)||v.startsWith('/')) return false;
  const parts=(v.endsWith('/')?v.slice(0,-1):v).split('/');
  return parts.every(p=>p!==''&&p!=='.'&&p!=='..');
}
function onlyKeys(o,allowed,name,E){
  const extra=Object.keys(o).filter(k=>!allowed.includes(k)).sort();
  if(extra.length) E.push(name+' 有不認得的欄位: '+extra.join(', '));
}
function validate(D){
  const E=[];
  if(!obj(D)) return ['資料必須是 JSON 物件'];
  if(D.schema!==SCHEMA) E.push('schema 必須是 '+SCHEMA+({3:' (schema 3 是舊的 data.js 格式: repo 改成 repo_url, 並加上 commit, schema 改成 5, 見 TECHNICAL.md)',4:' (schema 4 的欄位在 schema 5 都一樣, 把 schema 改成 5 即可; schema 5 另外可選 changes 與 features[].commits, 見 TECHNICAL.md)'}[D.schema]||''));
  onlyKeys(D,['schema','title','repo_url','commit','path','generated_at','changes','features','tree'],'資料',E);
  for(const k of ['title','path','generated_at']) if(!str(D[k])) E.push(k+' 必須是非空字串');
  if(!(typeof D.repo_url==='string'&&GITHUB.test(D.repo_url))) E.push('repo_url 必須是 https://github.com/<owner>/<repo> (結尾不加 / 與 .git): '+JSON.stringify(D.repo_url));
  if(!(typeof D.commit==='string'&&SHA.test(D.commit))) E.push('commit 必須是 40 碼小寫 hex 的完整 sha: '+JSON.stringify(D.commit));
  const pathOk=str(D.path)&&(D.path==='.'||(validPath(D.path)&&!D.path.endsWith('/')));
  if(str(D.path)&&!pathOk) E.push('path 格式錯誤 (repo 內的相對路徑, 不加結尾 /, 整個 repo 寫 "."): '+D.path);
  const scoped=D.path==='.'?'':D.path+'/';
  const known=new Set();
  if(!Array.isArray(D.tree)||!D.tree.length) E.push('tree 必須是非空的檔案路徑陣列');
  else {
    const seen=new Set();
    D.tree.forEach((p,i)=>{
      if(!validPath(p)||p.endsWith('/')){E.push('tree['+i+'] 不是合法的檔案路徑: '+JSON.stringify(p));return;}
      if(seen.has(p)) E.push('tree 有重複路徑: '+p);
      seen.add(p);
      if(pathOk&&!p.startsWith(scoped)){E.push('tree 有超出 path 的檔案: '+p);return;}
      known.add(p);
      const parts=p.split('/');
      for(let j=1;j<parts.length;j++){const dir=parts.slice(0,j).join('/')+'/';if(dir.startsWith(scoped))known.add(dir);}
    });
  }
  // changes (選填): base_commit..commit 的檔案變動. 刪除的檔案不在 tree (commit 那一版沒有它), 但目錄樹與 target 要認得它
  const hasChanges=D.changes!==undefined;
  if(hasChanges) {
    const C=D.changes;
    if(!obj(C)) E.push('changes 必須是物件');
    else {
      onlyKeys(C,['base','base_commit','files'],'changes',E);
      if(!str(C.base)) E.push('changes.base 必須是非空字串 (比較起點的名稱, 例如 tag)');
      if(!(typeof C.base_commit==='string'&&SHA.test(C.base_commit))) E.push('changes.base_commit 必須是 40 碼小寫 hex 的完整 sha: '+JSON.stringify(C.base_commit));
      else if(C.base_commit===D.commit) E.push('changes.base_commit 和 commit 相同, 沒有可比較的範圍');
      if(!Array.isArray(C.files)) E.push('changes.files 必須是陣列');
      else {
        const seen=new Set(), inTree=new Set(Array.isArray(D.tree)?D.tree:[]);
        C.files.forEach((f,i)=>{
          const where='changes.files['+i+']';
          if(!obj(f)){E.push(where+' 必須是物件');return;}
          onlyKeys(f,['path','status','adds','dels'],where,E);
          if(!validPath(f.path)||f.path.endsWith('/')){E.push(where+'.path 不是合法的檔案路徑: '+JSON.stringify(f.path));return;}
          if(seen.has(f.path)) E.push('changes.files 有重複路徑: '+f.path);
          seen.add(f.path);
          if(pathOk&&!f.path.startsWith(scoped)) E.push('changes.files 有超出 path 的檔案: '+f.path);
          if(!['A','M','D'].includes(f.status)) E.push(where+'.status 必須是 A (新增), M (修改) 或 D (刪除): '+JSON.stringify(f.status));
          const count=v=>v===null||(Number.isInteger(v)&&v>=0);
          if(!count(f.adds)||!count(f.dels)) E.push(where+'.adds / dels 必須是非負整數 (binary 檔兩個都寫 null)');
          else if((f.adds===null)!==(f.dels===null)) E.push(where+': binary 檔的 adds 與 dels 必須同時是 null');
          if(f.status==='D') {
            if(inTree.has(f.path)) E.push(where+': 刪除的檔案不能在 tree 裡 (tree 是 commit 那一版的檔案): '+f.path);
            else if(pathOk&&f.path.startsWith(scoped)) {known.add(f.path);const parts=f.path.split('/');for(let j=1;j<parts.length;j++){const dir=parts.slice(0,j).join('/')+'/';if(dir.startsWith(scoped))known.add(dir);}}
          } else if(['A','M'].includes(f.status)&&!inTree.has(f.path)) E.push(where+': 新增或修改的檔案必須在 tree 裡: '+f.path);
        });
      }
    }
  }
  if(!Array.isArray(D.features)||!D.features.length){E.push('features 必須是非空陣列');return E;}
  const ids=new Set();
  D.features.forEach((f,i)=>{
    const name='features['+i+']';
    if(!obj(f)){E.push(name+' 必須是物件');return;}
    onlyKeys(f,['id','title','why','targets','commits'],name,E);
    for(const k of ['id','title','why']) if(!str(f[k])) E.push(name+'.'+k+' 必須是非空字串');
    const label=str(f.id)?f.id:name;
    if(str(f.id)){if(ids.has(f.id))E.push('feature id 重複: '+f.id);ids.add(f.id);}
    // commits (選填): 這個功能在比較範圍內的 commit. 只有 changes 存在時才有意義
    if(f.commits!==undefined) {
      if(!hasChanges) E.push(label+'.commits 只能用在有 changes 的資料 (commit 是 changes 範圍內的 commit)');
      else if(!Array.isArray(f.commits)||!f.commits.length) E.push(label+'.commits 必須是非空陣列 (沒有 commit 就不要寫這個欄位)');
      else {
        const shas=new Set(), PR=typeof D.repo_url==='string'?D.repo_url+'/pull/':null;
        f.commits.forEach((c,j)=>{
          const where=label+'.commits['+j+']';
          if(!obj(c)){E.push(where+' 必須是物件');return;}
          onlyKeys(c,['sha','pr'],where,E);
          if(!(typeof c.sha==='string'&&SHA.test(c.sha))) E.push(where+'.sha 必須是 40 碼小寫 hex 的完整 sha: '+JSON.stringify(c.sha));
          else {if(shas.has(c.sha))E.push(label+': 重複 commit '+c.sha);shas.add(c.sha);}
          if(c.pr!==undefined&&!(typeof c.pr==='string'&&PR&&c.pr.startsWith(PR)&&/^[1-9][0-9]*$/.test(c.pr.slice(PR.length)))) E.push(where+'.pr 必須是 <repo_url>/pull/<編號>: '+JSON.stringify(c.pr));
        });
      }
    }
    if(!Array.isArray(f.targets)||!f.targets.length){E.push(label+'.targets 必須是非空陣列');return;}
    const seen=new Set();
    f.targets.forEach((t,j)=>{
      const where=label+'.targets['+j+']';
      if(!obj(t)){E.push(where+' 必須是物件');return;}
      onlyKeys(t,['path','note'],where,E);
      if(!validPath(t.path)){E.push(where+'.path 不是合法的相對路徑: '+JSON.stringify(t.path));return;}
      if(!str(t.note)) E.push(where+'.note 必須是非空字串');
      if(seen.has(t.path)) E.push(label+': 重複 target '+t.path);
      seen.add(t.path);
